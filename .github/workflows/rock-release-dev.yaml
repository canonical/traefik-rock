name: "Publish rock to GHCR:dev"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        required: true
        default: "main"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Determine modified rocks
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.changed-versions.outputs.versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Find changed rockcraft.yaml files
        id: changed-versions
        run: |
          # Compare branch against main to find changed rockcraft.yaml files
          changed_files=$(git diff --name-only origin/main..HEAD -- '**/rockcraft.yaml' || true)
          versions=""
          for file in $changed_files; do
            version="$(dirname $file)"
            versions="${versions:+$versions }$version"
          done
          echo "versions=$versions"
          echo "versions=$versions" >> $GITHUB_OUTPUT

  build-and-publish:
    name: Pack, test and publish
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.versions != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Install dependencies
        run: |
          sudo snap install rockcraft --classic
          # Install goss for testing
          curl -fsSL https://goss.rocks/install | sh

      - name: Pack, test and push rocks
        run: |
          for version in ${{ needs.detect-changes.outputs.versions }}; do
            echo "::group::Packing rock for version $version"
            cd "$version"
            rockcraft pack
            cd ..
            echo "::endgroup::"

            echo "::group::Testing rock for version $version"
            rock_file=$(ls $version/*.rock)
            sudo rockcraft.skopeo --insecure-policy copy \
              "oci-archive:$rock_file" \
              docker-daemon:traefik-test:latest
            GOSS_FILES_PATH="$GITHUB_WORKSPACE" \
            GOSS_OPTS="--retry-timeout=60s" \
              dgoss run traefik-test:latest
            docker rmi traefik-test:latest
            echo "::endgroup::"

            echo "::group::Pushing rock for version $version to GHCR"
            sudo rockcraft.skopeo --insecure-policy copy \
              "oci-archive:$rock_file" \
              "docker://ghcr.io/canonical/traefik:dev" \
              --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
            echo "::endgroup::"
          done
