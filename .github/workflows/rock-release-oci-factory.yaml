name: Open a PR to OCI Factory

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated list of version directories (e.g. 2.11.0,2.11.3)"
        required: true
        type: string

jobs:
  prepare:
    name: Prepare versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.format-json.outputs.versions }}
    steps:
      - name: Format versions as JSON array
        id: format-json
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          JSON_ARRAY=$(echo "$VERSIONS" | tr ',' '\n' | jq -R . | jq -c -s .)
          echo "versions=$JSON_ARRAY" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Pack and test ${{ matrix.version }} on ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner-labels }}
    needs: [prepare]
    strategy:
      fail-fast: true
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
        platform:
          - name: amd64
            arch: amd64
            runner-labels: [ubuntu-latest]
          - name: arm64
            arch: arm64
            runner-labels: [ubuntu-24.04-arm]
          - name: s390x
            arch: s390x
            runner-labels: [self-hosted-linux-s390x-noble-medium]
    steps:
      - name: Checkout the rock repository
        uses: actions/checkout@v4
        with:
          path: rock

      - name: Install yq
        run: sudo snap install yq

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Install rockcraft
        run: sudo snap install rockcraft --classic --channel=latest/candidate

      - name: Check architecture compatibility
        id: check-arch
        run: |
          cd "rock/${{ matrix.version }}"
          if ! rockcraft expand-extensions | yq '.platforms | keys | .[]' | grep -q "^${{ matrix.platform.arch }}$"; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${{ matrix.platform.arch }} for version ${{ matrix.version }} (not supported after evaluation)"
          else
            echo "supported=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install goss
        if: steps.check-arch.outputs.supported == 'true'
        run: ./rock/scripts/install-goss.sh

      - name: Pack and test rock
        if: steps.check-arch.outputs.supported == 'true'
        env:
          GOSS_FILES_PATH: ${{ github.workspace }}/rock
        run: |
          cd rock
          ./scripts/pack-and-test.sh ${{ matrix.version }}

  release:
    name: Open PR to OCI Factory
    runs-on: ubuntu-latest
    needs: [prepare, build-and-test]
    if: needs.prepare.outputs.versions != '[]'
    steps:
      - name: Checkout the rock repository
        uses: actions/checkout@v4
        with:
          path: rock

      - name: Fork sync and clone OCI Factory
        env:
          GH_TOKEN: ${{ secrets.IS_DEVOPS_BOT_TOKEN }}
        run: |
          gh repo sync --force is-devops-bot/oci-factory || \
            gh repo fork canonical/oci-factory --clone=false
          gh repo sync --force is-devops-bot/oci-factory

      - name: Clone the OCI Factory fork
        uses: actions/checkout@v4
        with:
          path: oci-factory
          repository: is-devops-bot/oci-factory
          token: ${{ secrets.IS_DEVOPS_BOT_TOKEN }}

      - name: Generate image.yaml
        id: generate-manifest
        env:
          MANIFEST_FILE: ${{ github.workspace }}/oci-factory/oci/traefik/image.yaml
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          cd rock
          versions="${VERSIONS//,/ }"
          ./scripts/generate-image-yaml.sh $versions
          echo "now_epoch=$(date -d now +%s)" >> $GITHUB_OUTPUT

      - name: Commit to the fork
        uses: EndBug/add-and-commit@v9
        with:
          add: "oci/traefik/image.yaml"
          cwd: "./oci-factory"
          message: "chore: Add new traefik releases"
          new_branch: "update-${{ steps.generate-manifest.outputs.now_epoch }}"
          push: "origin update-${{ steps.generate-manifest.outputs.now_epoch }} --force"

      - name: Open a PR from the fork to upstream
        env:
          GH_TOKEN: ${{ secrets.IS_DEVOPS_BOT_TOKEN }}
          OCI_FACTORY_DIR: ${{ github.workspace }}/oci-factory
          SOURCE_REPO: ${{ github.repository }}
        run: ./rock/scripts/open-oci-factory-pr.sh "update-${{ steps.generate-manifest.outputs.now_epoch }}"
